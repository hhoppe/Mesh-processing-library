# Check that test/Resample_parity.inc, the parity cases asserted by test/Resample_test.cpp, still matches the
# results of the latest published Python package resampler: regenerate it and require that no value changed.
name: Resampler parity

on:
  schedule:
    - cron: '0 12 * * 0'  # Weekly, on Sundays at 12:00 UTC.
  push:
    paths:
      - test/resampler_parity.py
      - test/Resample_parity.inc
      - .github/workflows/resampler-parity.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  parity:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install resampler
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install resampler

      - name: Regenerate and compare
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I test/resampler_parity.py >test/Resample_parity.inc
          # The header line names the version of resampler, which may change without changing any value.
          git diff --exit-code -I '^// Generated by' test/Resample_parity.inc
