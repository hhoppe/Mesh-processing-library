    <text x="166" y="172" font-size="13.5" font-weight="500" fill="#bc3a24" text-anchor="middle">B</text>
    <path d="M 346 78 A 16 16 0 1 0 330 94" fill="none" stroke="#14222b" stroke-width="1.6" marker-end="url(#wind-arrow)"/>
    <text x="60" y="222" font-size="13.5" fill="#14222b">B is below the arc A→C → counter-clockwise</text>
    <line x1="440" y1="24" x2="440" y2="226" stroke="#14222b" stroke-width="1" opacity="0.25"/>
    <text x="480" y="34" font-family="Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#14222b" opacity="0.7">EDGES AS STRAIGHT UV SEGMENTS</text>
    <line x1="500" y1="170" x2="840" y2="132" stroke="#14222b" stroke-width="2"/>
    <line x1="500" y1="170" x2="610" y2="150" stroke="#bc3a24" stroke-width="1.6"/>
    <line x1="610" y1="150" x2="840" y2="132" stroke="#bc3a24" stroke-width="1.6"/>
    <circle cx="500" cy="170" r="5" fill="#14222b"/>
    <circle cx="840" cy="132" r="5" fill="#14222b"/>
    <circle cx="610" cy="150" r="5.5" fill="#bc3a24"/>
    <text x="492" y="190" font-size="13.5" font-weight="500" fill="#14222b" text-anchor="end">A</text>
    <text x="850" y="128" font-size="13.5" font-weight="500" fill="#14222b">C</text>
    <text x="606" y="140" font-size="13.5" font-weight="500" fill="#bc3a24" text-anchor="middle">B</text>
    <path d="M 754 78 A 16 16 0 1 1 770 94" fill="none" stroke="#bc3a24" stroke-width="1.6" marker-end="url(#wind-arrow-flip)"/>
    <text x="500" y="222" font-size="13.5" fill="#bc3a24">B is above the segment A→C → clockwise</text>
  </g>
  <text font-size="13" fill="#5a7382">
    <tspan x="40" y="816">Schematic, not to scale.  Both halves are in the lon-lat domain and differ only in how the vertices are joined.</tspan>
    <tspan x="40" y="834">Away from the cut and the poles the lon-lat map preserves orientation, so the triangle bounded by the</tspan>
    <tspan x="40" y="852">great-circle arcs (left) winds as it does on the sphere, whereas texture mapping uses straight uv segments (right).</tspan>
  </text>

  <!-- Panel 3: the pole. -->
