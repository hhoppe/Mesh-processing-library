    <circle cx="700" cy="56" r="4.5" fill="#0a6f8a"/>
    <circle cx="830" cy="56" r="4.5" fill="#0a6f8a"/>
    <text x="508" y="44" font-family="Consolas, monospace" font-size="11.5" fill="#0a6f8a">u₀ = 0</text>
    <text x="614" y="44" font-family="Consolas, monospace" font-size="11.5" fill="#0a6f8a" text-anchor="middle">u₁</text>
    <text x="700" y="44" font-family="Consolas, monospace" font-size="11.5" fill="#0a6f8a" text-anchor="middle">u₂</text>
    <text x="822" y="44" font-family="Consolas, monospace" font-size="11.5" fill="#0a6f8a" text-anchor="end">u₃ = 1</text>
    <text x="567" y="106" font-size="12" fill="#14222b" opacity="0.62" text-anchor="middle">gap</text>
    <text x="668" y="102" font-size="12" fill="#14222b" opacity="0.62" text-anchor="middle">gap</text>
    <text x="767" y="80" font-size="12" fill="#14222b" opacity="0.62" text-anchor="middle">gap</text>
    <text x="500" y="212" font-family="Consolas, monospace" font-size="11.5" fill="#14222b" opacity="0.7" text-anchor="middle">u = 0</text>
    <text x="830" y="212" font-family="Consolas, monospace" font-size="11.5" fill="#14222b" opacity="0.7" text-anchor="middle">u = 1</text>
    <text x="480" y="244" font-size="13" fill="#14222b" opacity="0.8">Each corner takes its own face's longitude.</text>
  </g>
  <text font-size="13" fill="#5a7382">
    <tspan x="40" y="1184">Splitting the edge through the pole gives the pole its own vertex, whose corners each carry their own longitude,</tspan>
    <tspan x="40" y="1202">from u = 0 to u = 1, like the two corners along the prime-meridian cut; the wedges between the polar faces are</tspan>
    <tspan x="40" y="1220">left uncovered.</tspan>
  </text>
</svg>
