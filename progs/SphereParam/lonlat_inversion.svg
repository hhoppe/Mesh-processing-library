  </g>
  <text font-size="13" fill="#5a7382">
    <tspan x="40" y="450">Face 59335 of bunny.sphparam.m before the repair, drawn in the lon-lat (uv) domain at its real coordinates.</tspan>
    <tspan x="40" y="468">Mapped into lon-lat, the great-circle edge A→C bows up to 0.127° poleward of the straight uv segment A→C.</tspan>
    <tspan x="40" y="486">Vertex B lies 0.020° above the segment but 0.073° below the arc, so the triangle winds counter-clockwise on</tspan>
    <tspan x="40" y="504">the sphere but clockwise in uv (uv area −2.01e−6).</tspan>
  </text>

  <!-- Panel 2: the same three points, two windings. -->
  <text x="40" y="562" font-family="Georgia, serif" font-size="21" font-weight="600" fill="#14222b">2. The same three points, two windings</text>
  <g transform="translate(0, 558)">
    <text x="60" y="34" font-family="Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#14222b" opacity="0.7">EDGES AS GREAT-CIRCLE ARCS</text>
    <path d="M 60 170 Q 230 68 400 132" fill="none" stroke="#0a6f8a" stroke-width="2.4"/>
    <path d="M 60 170 Q 115 150 170 150" fill="none" stroke="#0a6f8a" stroke-width="1.6"/>
    <path d="M 170 150 Q 285 110 400 132" fill="none" stroke="#0a6f8a" stroke-width="1.6"/>
    <circle cx="60" cy="170" r="5" fill="#14222b"/>
    <circle cx="400" cy="132" r="5" fill="#14222b"/>
